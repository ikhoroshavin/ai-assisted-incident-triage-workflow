# Включить: pip install -r requirements-dev.txt && pre-commit install
# Пока не закоммичены, хуки не трогают незавершённую работу владельца (убрать после коммита).
exclude: ^(workflow\.py|\.env|output\.txt)$
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key
